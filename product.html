<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Ophelia</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-mount"></div>

<main class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a><span>/</span>
    <a href="category.html?cat=all" id="crumbCat">Shop</a><span>/</span>
    <span id="crumbName">Product</span>
  </div>

  <section id="pdpSection" style="padding-top:20px;">
    <div class="pdp-grid">
      <div class="pdp-media">
        <canvas class="pdp-canvas" id="pdpCanvas"></canvas>
        <span class="card-badge pdp-badge" id="pdpBadge" style="display:none;"></span>
      </div>
      <div>
        <p class="pdp-cat" id="pdpCat"></p>
        <h1 class="pdp-name" id="pdpName"></h1>
        <p class="pdp-sub" id="pdpSub"></p>
        <div class="pdp-price-row">
          <span class="pdp-price-new" id="pdpPriceNew"></span>
        </div>
        <p class="pdp-desc" id="pdpDesc"></p>

        <ul class="pdp-features" id="pdpFeatures"></ul>

        <div class="option-block">
          <p class="option-label" id="pdpVariantLabel">Shade</p>
          <div class="variant-row" id="pdpVariants"></div>
        </div>

        <div class="option-block">
          <p class="option-label">Quantity</p>
          <div class="qty-row">
            <button class="qty-btn" id="qtyMinus">&minus;</button>
            <span class="qty-value" id="qtyValue">1</span>
            <button class="qty-btn" id="qtyPlus">+</button>
          </div>
        </div>

        <p class="stock-note">&#10003; In stock &mdash; ready to ship</p>

        <div class="pdp-actions">
          <button class="btn btn-primary" id="addToCartBtn" style="flex:1;">Add to Cart</button>
          <button class="btn btn-gold" id="buyNowBtn" style="flex:1;">Buy Now</button>
        </div>

        <div class="info-strip">
          <div>&#128666; Free delivery over ORD 800</div>
          <div>&#8635; 30-day returns</div>
          <div>&#9878; Shade-match guarantee</div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head" style="text-align:left; margin-bottom:24px;">
      <p class="eyebrow">You May Also Like</p>
      <h2 class="section-title" style="font-size:26px;">Complete the look</h2>
    </div>
    <div class="grid" id="relatedGrid"></div>
  </section>
</main>

<div id="footer-mount"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script type="module">
  import { initLocket } from './js/locket3d.js';

  const params = new URLSearchParams(location.search);
  const productId = params.get("id") || PRODUCTS[0].id;
  const product = getProduct(productId) || PRODUCTS[0];
  let selectedVariant = product.variants[0];
  let qty = 1;

  function render() {
    document.title = `${product.name} — Ophelia`;
    document.getElementById("crumbCat").textContent = CATEGORY_INFO[product.cat].label;
    document.getElementById("crumbCat").href = `category.html?cat=${product.cat}`;
    document.getElementById("crumbName").textContent = product.name;
    document.getElementById("pdpCat").textContent = CATEGORY_INFO[product.cat].label;
    document.getElementById("pdpName").textContent = product.name;
    document.getElementById("pdpSub").textContent = `${product.sub} · ${product.size}`;
    document.getElementById("pdpPriceNew").textContent = `ORD ${product.price}`;
    document.getElementById("pdpDesc").textContent = product.desc;
    document.getElementById("pdpFeatures").innerHTML = product.features.map(f => `<li>${f}</li>`).join("");
    document.getElementById("pdpVariantLabel").textContent = product.variantLabel;
    document.getElementById("pdpVariants").innerHTML = product.variants.map(v =>
      `<button class="variant-btn ${v === selectedVariant ? "active" : ""}" data-v="${v}">${v}</button>`
    ).join("");
    document.getElementById("qtyValue").textContent = qty;

    if (product.badge) {
      const b = document.getElementById("pdpBadge");
      b.style.display = "inline-block"; b.textContent = product.badge;
    }

    document.querySelectorAll(".variant-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedVariant = btn.dataset.v;
        document.querySelectorAll(".variant-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    // related products
    const related = getRelated(product, 4);
    document.getElementById("relatedGrid").innerHTML = related.map(p => `
      <article class="card tilt">
        ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ""}
        <a href="product.html?id=${p.id}">
          <div class="card-media"><img src="assets/lipstick.jpg" alt="${p.name}" class="card-photo"></div>
          <div class="card-body">
            <p class="card-cat">${CATEGORY_INFO[p.cat].label}</p>
            <h3 class="card-name">${p.name}</h3>
            <p class="card-sub">${p.sub}</p>
            <div class="price-row"><span class="price-new">ORD ${p.price}</span></div>
          </div>
        </a>
        <div class="card-cta"><button class="btn btn-outline btn-full" onclick="addToCart('${p.id}','${p.variants[0]}',1); showToast('Added ${p.name} to cart');">Add to Cart</button></div>
      </article>`).join("");

    enableTilt(".tilt");
  }

  document.getElementById("qtyMinus").addEventListener("click", () => { if (qty > 1) qty--; document.getElementById("qtyValue").textContent = qty; });
  document.getElementById("qtyPlus").addEventListener("click", () => { qty++; document.getElementById("qtyValue").textContent = qty; });
  document.getElementById("addToCartBtn").addEventListener("click", () => {
    addToCart(product.id, selectedVariant, qty);
    showToast(`Added ${qty} × ${product.name} (${selectedVariant}) to cart`);
  });
  document.getElementById("buyNowBtn").addEventListener("click", () => {
    addToCart(product.id, selectedVariant, qty);
    location.href = "checkout.html";
  });

  injectChrome(null);
  render();

  // 3D product locket, tinted to this product's own swatch colour
  const canvas = document.getElementById("pdpCanvas");
  initLocket(canvas, { swatchColor: parseInt(product.swatch.replace("#","0x")), ambientParticles: false, interactive: true });
</script>
</body>
</html>
