<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Ophelia</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-mount"></div>

<main class="container" style="padding-top:20px; padding-bottom:60px;">
  <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Account</span></div>

  <!-- SIGNED OUT: sign in / create account -->
  <section id="authSection" style="max-width:420px; margin:20px auto 0;">
    <div class="chip-row" style="justify-content:center; margin-bottom:26px;">
      <button class="chip active" id="tabSignIn">Sign In</button>
      <button class="chip" id="tabSignUp">Create Account</button>
    </div>

    <form id="signInForm">
      <div class="field" style="margin-bottom:14px;"><label>Email</label><input type="email" id="siEmail" required placeholder="you@email.com"></div>
      <div class="field" style="margin-bottom:14px;"><label>Password</label><input type="password" id="siPassword" required placeholder="••••••••"></div>
      <p class="promo-msg" id="siMsg"></p>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>

    <form id="signUpForm" style="display:none;">
      <div class="field" style="margin-bottom:14px;"><label>Full Name</label><input type="text" id="suName" required placeholder="Isabel Aurenhall"></div>
      <div class="field" style="margin-bottom:14px;"><label>Email</label><input type="email" id="suEmail" required placeholder="you@email.com"></div>
      <div class="field" style="margin-bottom:14px;"><label>Password</label><input type="password" id="suPassword" required minlength="6" placeholder="At least 6 characters"></div>
      <p class="promo-msg" id="suMsg"></p>
      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>
  </section>

  <!-- SIGNED IN: profile + order history -->
  <section id="accountSection" style="display:none; max-width:640px; margin:20px auto 0;">
    <h1 class="serif" style="font-size:28px; margin-bottom:4px;">Welcome back, <span id="acctName"></span></h1>
    <p style="color:var(--midtext); font-size:14px; margin-bottom:26px;" id="acctEmail"></p>

    <h2 class="serif" style="font-size:20px; margin-bottom:14px;">Your Orders</h2>
    <div id="ordersList"></div>
    <p id="noOrdersMsg" style="display:none; color:var(--midtext); font-size:14px;">No orders yet — your Ophelia pieces will appear here once you check out.</p>

    <button class="btn btn-outline" id="signOutBtn" style="margin-top:30px;">Sign Out</button>
  </section>
</main>

<div id="footer-mount"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  injectChrome(null);

  const tabSignIn = document.getElementById("tabSignIn");
  const tabSignUp = document.getElementById("tabSignUp");
  const signInForm = document.getElementById("signInForm");
  const signUpForm = document.getElementById("signUpForm");

  tabSignIn.addEventListener("click", () => {
    tabSignIn.classList.add("active"); tabSignUp.classList.remove("active");
    signInForm.style.display = "block"; signUpForm.style.display = "none";
  });
  tabSignUp.addEventListener("click", () => {
    tabSignUp.classList.add("active"); tabSignIn.classList.remove("active");
    signUpForm.style.display = "block"; signInForm.style.display = "none";
  });

  signInForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("siMsg");
    msg.textContent = "Signing in…"; msg.className = "promo-msg";
    const { error } = await ophSignIn(
      document.getElementById("siEmail").value,
      document.getElementById("siPassword").value
    );
    if (error) { msg.textContent = error.message; msg.className = "promo-msg err"; return; }
    location.reload();
  });

  signUpForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("suMsg");
    msg.textContent = "Creating account…"; msg.className = "promo-msg";
    const { error } = await ophSignUp(
      document.getElementById("suEmail").value,
      document.getElementById("suPassword").value,
      document.getElementById("suName").value
    );
    if (error) { msg.textContent = error.message; msg.className = "promo-msg err"; return; }
    msg.textContent = "Account created — check your email to confirm, then sign in.";
    msg.className = "promo-msg ok";
  });

  document.getElementById("signOutBtn").addEventListener("click", ophSignOut);

  function money(n) { return `ORD ${Number(n).toFixed(0)}`; }

  function renderOrder(o) {
    const items = (o.order_items || []).map(i =>
      `<div class="summary-row"><span>${i.product_name} — ${i.variant} × ${i.qty}</span><span>${money(i.line_total)}</span></div>`
    ).join("");
    return `
      <div class="order-summary-box">
        <div class="summary-row" style="font-weight:700; color:var(--umber);">
          <span>${o.order_number}</span><span>${new Date(o.created_at).toLocaleDateString()}</span>
        </div>
        ${items}
        <div class="summary-row total"><span>Total</span><span>${money(o.total)}</span></div>
        <p style="font-size:12px; color:var(--midtext); margin-top:8px;">Transaction ID: ${o.transaction_id || "—"}</p>
      </div>`;
  }

  (async function initAccountPage() {
    const user = await ophCurrentUser();
    const authSection = document.getElementById("authSection");
    const acctSection = document.getElementById("accountSection");

    if (!user) { authSection.style.display = "block"; acctSection.style.display = "none"; return; }

    authSection.style.display = "none";
    acctSection.style.display = "block";
    document.getElementById("acctName").textContent = user.user_metadata?.full_name || "there";
    document.getElementById("acctEmail").textContent = user.email;

    const orders = await ophFetchMyOrders();
    const list = document.getElementById("ordersList");
    if (orders.length === 0) {
      document.getElementById("noOrdersMsg").style.display = "block";
    } else {
      list.innerHTML = orders.map(renderOrder).join("");
    }
  })();
</script>
</body>
</html>
