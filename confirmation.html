<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Ophelia</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-mount"></div>

<main class="container">
  <div class="confirm-wrap" id="confirmWrap">
    <div class="confirm-check">&#10003;</div>
    <h1 class="serif" style="font-size:30px;">Payment Confirmed</h1>
    <p style="color:var(--midtext); font-size:15px; margin-top:10px;">Thank you — your order is on its way. A confirmation has been sent to your email.</p>

    <div class="order-summary-box" id="orderBox"></div>

    <a href="category.html?cat=all" class="btn btn-primary">Continue Shopping</a>
  </div>
</main>

<div id="footer-mount"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  injectChrome(null);

  const raw = sessionStorage.getItem("ophelia_last_order");
  if (!raw) {
    document.getElementById("confirmWrap").innerHTML = `
      <h1 class="serif" style="font-size:28px;">No recent order found</h1>
      <p style="color:var(--midtext); margin:14px 0 24px;">Looks like there's nothing to confirm yet.</p>
      <a href="category.html?cat=all" class="btn btn-primary">Start Shopping</a>`;
  } else {
    const order = JSON.parse(raw);
    document.getElementById("orderBox").innerHTML = `
      <p style="font-size:13px; color:var(--gold); font-weight:700; letter-spacing:0.5px; margin-bottom:14px;">ORDER ${order.orderNumber}</p>
      ${order.lines.map(l => `
        <div style="display:flex; justify-content:space-between; font-size:14px; padding:8px 0; border-bottom:1px dashed var(--line);">
          <span>${l.name} <span style="color:var(--midtext);">(${l.variant}) &times;${l.qty}</span></span>
          <span style="font-weight:600;">ORD ${l.lineTotal}</span>
        </div>`).join("")}
      <div style="display:flex; justify-content:space-between; font-size:17px; font-weight:700; color:var(--umber); padding-top:14px; margin-top:6px;">
        <span>Total Paid</span><span>ORD ${order.total}</span>
      </div>
      <p style="font-size:13px; color:var(--midtext); margin-top:16px;">Delivering to: ${order.customer.name}, ${order.customer.address}${order.customer.city ? ", " + order.customer.city : ""}</p>
      <p style="font-size:13px; color:var(--midtext); margin-top:6px;">Transaction ID: <span style="color:var(--darktext); font-weight:600;">${order.transactionId || "—"}</span></p>
    `;
  }
</script>
</body>
</html>
